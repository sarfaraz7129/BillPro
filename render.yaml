services:
  - type: web
    name: billpro
    runtime: node
    plan: free
    region: singapore # Change to oregon or frankfurt if preferred
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # NOTE: Do NOT add a PORT variable here; Render automatically assigns and manages PORT.
      #
      # To enable persistent storage on Render (Starter plan or above):
      # - key: BILLPRO_DATA_DIR
      #   value: /var/data
    # disk:
    #   name: billpro-data
    #   mountPath: /var/data
    #   sizeGB: 1
