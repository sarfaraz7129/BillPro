name: Keep BillPro warm during customer hours

on:
  schedule:
    - cron: '45,55 5 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '5,15,25,35,45,55 6-21 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '5,15,25,35,45 22 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-render:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake or keep the Render service warm
        run: curl --fail --silent --show-error --retry 3 --retry-connrefused --retry-delay 10 --retry-max-time 180 --max-time 120 https://billpro-kye9.onrender.com/api/time --output /dev/null
